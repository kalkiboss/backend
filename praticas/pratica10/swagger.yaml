openapi: 3.0.0
info:
  title: Minha API REST
  version: 0.1
servers:
  - url: http://localhost:3000/
tags:
  - name: usuarios
components:
  securitySchemes:
    JWTAuth:
      type: apiKey
      in: header
      name: Authorization
  schemas:
    Usuario:
      type: object
      properties:
        _id:
          type: string
        email:
          type: string
    Mensagem:
      type: object
      properties:
        msg:
          type: string

paths:
  /usuarios:
    post:
      tags:
        - usuarios
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - senha
              properties:
                email:
                  type: string
                senha:
                  type: string
      responses:
        '201':
          description: Criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '422':
          description: Erro de validação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
    delete:
      tags:
        - usuarios
      security:
        - JWTAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - usuario
              properties:
                usuario:
                  type: string
      responses:
        '204':
          description: Removido com sucesso
  
  /usuarios/login:
    post:
      tags:
        - usuarios
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - usuario
                - senha
              properties:
                usuario:
                  type: string
                senha:
                  type: string
      responses:
        '200':
          description: Login realizado
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'

  /usuarios/renovar:
    post:
      tags:
        - usuarios
      security:
        - JWTAuth: []
      responses:
        '200':
          description: Token renovado
        '401':
          description: Não autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'